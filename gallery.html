<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="portfolio-web-creator" />
    <meta name="keywords" content="Front-End" />
    <meta name="author" content="Oleg Troian" />
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/gallery.css" />
    <link rel="stylesheet" href="./css/media-queries.css" />
    <link rel="stylesheet" href="./svg/icons.css" />
    <!-- JS-GALLERY -->
     <script src="./js/gallery.js" defer></script>
    <!-- KIT-FONTAWESOME -->
    <script
      src="https://kit.fontawesome.com/53c6f727c2.js"
      crossorigin="anonymous"
    ></script>
    <title>gallery</title>
  </head>
  <body>
    <main>
      <section class="gallery-section">
        <div class="home-container">
          <h4 class="home-tittle">
            <a href="./index.html" class="home-link">home</a>
          </h4>
        </div>
        <div class="gallery-header">
          <h2 class="gallery-title">projects</h2>
        </div>

        <div class="gallery-container container">
          <div class="content-gallery">
            <div class="arrow">
              <i class="fa-solid fa-arrow-left-long"></i>
            </div>

            <div class="gallery-img"></div>

            <div class="arrow">
              <i class="fa-solid fa-arrow-left-long arrow-right"></i>
            </div>
          </div>
        </div>
      </section>
    </main>
    <footer class="footer">
      <div class="footer-container">
        <div class="content-footer">
          <div class="logo-container">
            <a href="#home">
              <img
                src="./logo/my-logo-2-white.svg"
                alt="logo"
                class="footer-logo"
              />
            </a>
          </div>
          <div class="footer-icons">
            <ul class="footer-social">
              <li class="footer-item">
                <a href="#" class="footer-link">
                  <i class="icon-facebook icon-1"></i>
                </a>
              </li>
              <li class="footer-item">
                <a href="#" class="footer-link">
                  <i class="icon-telegram icon-2"></i>
                </a>
              </li>
              <li class="footer-item">
                <a href="#" class="footer-link">
                  <i class="icon-github icon-3"></i>
                </a>
              </li>
            </ul>
          </div>
        </div>
        <div class="footer-menu">
          <h4 class="title-menu">Page</h4>
          <ul class="footer-list">
            <li class="footer-item">
              <a href="#home" class="footer-links">Home</a>
            </li>
            <li class="footer-item">
              <a href="#skills" class="footer-links">Skills</a>
            </li>
            <li class="footer-item">
              <a href="#contact" class="footer-links">Contact</a>
            </li>
          </ul>
        </div>
        <div class="-information-section">
          <h4 class="title-menu">Information</h4>
          <ul class="footer-list">
            <li class="footer-item">
              <a href="#about" class="footer-links">About</a>
            </li>
            <li class="footer-item">
              <a href="#services" class="footer-links">Services</a>
            </li>
            <li class="footer-item">
              <a href="#experienc" class="footer-links">Experience</a>
            </li>
          </ul>
        </div>
      </div>
      <div class="line">
        <div class="br"></div>
      </div>
      <p class="footer-copy">
        Copyright <span class="c-footer">&copy;</span> 2024 Oleg
      </p>
    </footer>
  </body>
</html>
